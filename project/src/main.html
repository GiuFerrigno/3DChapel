<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Virtual Chapel</title>
    <link rel="icon" type="image/png" href="../textures/icon.png">
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>

      <!-- Istruzioni desktop -->
      <div id="hudDesktop" class="hud">
        <h1>Virtual Chapel</h1>
        <p>Trascina il mouse: guarda attorno</p>
        <p>W A S D: movimento</p>
        <p>Shift: aumenta velocità di movimento</p>
      </div>

      <!-- Istruzioni dispositivi touch -->
      <div id="hudMobile" class="hud">
        <h1>Virtual Chapel</h1>
        <p>Touch sinistro: movimento</p>
        <p>Touch destro: guarda attorno</p>
      </div>

      <!-- Joystick per movimento touch -->
      <div id="moveJoystick" class="joystick hidden">
        <div id="moveJoystickKnob" class="joystick-knob"></div>
      </div>
    </div>

    <!-- Librerie -->
    <script src="../lib/webgl-utils.js"></script>
    <script src="../lib/m4.js"></script>
    <script src="../lib/mesh_utils.js"></script>
    <script src="../lib/glm_utils.js"></script>
    <script src="../lib/dat.gui.js"></script>

    <!-- Moduli progetto -->
    <script src="./state.js"></script>
    <script src="./utils.js"></script>
    <script src="./input.js"></script>
    <script src="./loader.js"></script>
    <script src="./shadow.js"></script>
    <script src="./dust.js"></script>
    <script src="./light.js"></script>
    <script src="./column.js"></script>
    <script src="./plaque.js"></script>
    <script src="./chapel.js"></script>
    <script src="./chapel-interior.js"></script>
    <script src="./render.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
